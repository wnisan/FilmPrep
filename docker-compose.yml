# Весь сайт одной командой: docker compose up -d --build  (или start.bat)
# Сайт: http://localhost:8080   (порт меняется переменной FILMPREP_PORT)
name: filmprep

services:
  postgres:
    image: postgres:16-alpine
    container_name: filmprep-postgres
    restart: unless-stopped
    ports:
      # для локальной разработки (npm run dev); сайту в Docker не нужен
      - "5433:5432"
    environment:
      POSTGRES_USER: filmprep
      POSTGRES_PASSWORD: filmprep
      POSTGRES_DB: filmprep
    volumes:
      - filmprep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmprep -d filmprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: filmprep-api
    restart: unless-stopped
    env_file:
      # ключи LLM, Google, S3 — из того же файла, что и при разработке
      - path: server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://filmprep:filmprep@postgres:5432/filmprep
      UPLOAD_DIR: uploads
      CLIENT_ORIGIN: http://localhost:${FILMPREP_PORT:-8080}
      GOOGLE_REDIRECT_URI: http://localhost:${FILMPREP_PORT:-8080}/api/v1/auth/google/callback
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_DEMO_IMPORT: ${AUTO_DEMO_IMPORT:-true}
    volumes:
      # видео (локальное хранилище), субтитры, временные файлы нарезки
      - ./server/uploads:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./client
    container_name: filmprep-web
    restart: unless-stopped
    ports:
      - "${FILMPREP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  filmprep_pg_data:
