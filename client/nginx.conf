server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка фильмов из админки и «Моих фильмов» (VIDEO_MAX_UPLOAD_MB = 8 ГБ)
    client_max_body_size 8g;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/vnd.apple.mpegurl application/x-mpegURL text/vtt;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HLS: плейлисты и сегменты. Буферизуем, чтобы медленный клиент не держал API.
    location /api/v1/stream/ {
        proxy_pass http://api:4000;
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_read_timeout 120s;
        access_log off;
    }

    # Видео уходит в API потоком, без временного файла в nginx
    location ~ ^/api/v1/(admin/media|me/films)/[^/]+/video$ {
        proxy_pass http://api:4000;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
    }

    # Файлы сборки Vite с хэшем в имени
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /posters/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: любые другие пути отдаёт React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
